name: Publish to PyPI

# Publishes the `krono-py` distribution to PyPI under the `kronoguard`
# account (https://pypi.org/user/kronoguard/). Project page:
# https://pypi.org/project/krono-py/.
#
# Auth: PyPI Trusted Publishing (OIDC). No long-lived secret. The repo
# kronoguard/krono-py-lib is registered on PyPI as a trusted publisher for
# this workflow file; PyPI verifies the GitHub OIDC token from each run
# and accepts the upload if owner+repo+workflow (+optional environment)
# match the publisher entry.
#
# Migration note: the prior version of this workflow used a project-scoped
# API token via the PYPI_API_KEY secret. That secret is no longer
# required and should be deleted from the repo's GitHub Environments to
# remove dead credentials.
#
# See docs/PUBLISHING.md §2 for the Trusted Publishing setup details.

on:
  # Automatic: when the Release workflow creates a GitHub Release, push to PyPI.
  release:
    types: [published]

  # Manual: ad-hoc publish, with a TestPyPI safety toggle. Useful for verifying
  # the pipeline before doing a real release.
  workflow_dispatch:
    inputs:
      test-pypi:
        description: 'Publish to TestPyPI (https://test.pypi.org) instead of PyPI'
        type: boolean
        default: true
      ref:
        description: 'Git ref to build from (tag, branch, or SHA). Default: triggering ref.'
        type: string
        required: false
        default: ''

# OIDC requires id-token: write at the job (or workflow) level.
permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.ref || github.ref }}
  cancel-in-progress: false  # Never cancel an in-flight publish — twine isn't idempotent.

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest

    # The PyPI Trusted Publisher entry has "Environment name: (Any)", so this
    # environment block is optional from PyPI's perspective. We keep it for
    # GitHub-side controls: protection rules (required reviewers, deployment
    # branch restrictions) can be configured per environment without
    # touching this workflow.
    environment:
      name: ${{ inputs.test-pypi && 'test-pypi' || 'pypi' }}
      url: ${{ inputs.test-pypi && 'https://test.pypi.org/project/krono-py/' || 'https://pypi.org/project/krono-py/' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For release events, github.ref is refs/tags/<tag>; we want that tag's tree.
          # For dispatch, the user can override via inputs.ref.
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --all-extras

      # NEVER publish anything that fails quality or tests. The PyPI registry
      # accepts uploads but does NOT allow re-uploads of the same version —
      # a bad release sticks. Gating here is the last reasonable checkpoint.
      - name: Quality gate
        run: make quality

      - name: Test gate (coverage 97%)
        run: make test

      - name: Build distribution (wheel + sdist)
        run: |
          uv build
          ls -la dist/

      - name: Validate distribution metadata
        run: uv run --with twine twine check --strict dist/*

      - name: Publish to TestPyPI (OIDC)
        if: ${{ inputs.test-pypi == true }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          skip-existing: false
          print-hash: true

      - name: Publish to PyPI (OIDC)
        if: ${{ inputs.test-pypi != true }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          skip-existing: false
          print-hash: true

      - name: Summary
        run: |
          if [ "${{ inputs.test-pypi }}" = "true" ]; then
            echo "Published to TestPyPI: https://test.pypi.org/project/krono-py/"
            echo "Account:               https://test.pypi.org/user/kronoguard/"
            echo ""
            echo "Verify with:"
            echo "  pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ krono-py"
          else
            echo "Published to PyPI: https://pypi.org/project/krono-py/"
            echo "Account:           https://pypi.org/user/kronoguard/"
            echo ""
            echo "Verify with:"
            echo "  pip install krono-py"
          fi
